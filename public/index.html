<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icebreaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdn.socket.io/4.7.5/socket.io.min.js"
      integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-gray-900 text-white">
    <div id="app" class="container mx-auto p-4">
      <!-- Lobby: 방 입장 -->
      <div id="lobby" class="max-w-md mx-auto mt-10">
        <h1 class="text-3xl font-bold text-center mb-6">Icebreaker</h1>
        <div class="bg-gray-800 p-8 rounded-lg shadow-lg">
          <div class="mb-4">
            <label for="nickname" class="block mb-2 text-sm font-medium"
              >닉네임</label
            >
            <input
              type="text"
              id="nickname"
              class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="홍길동"
              required
            />
          </div>
          <div class="mb-6">
            <label for="room-id" class="block mb-2 text-sm font-medium"
              >방 코드 (6자리)</label
            >
            <input
              type="text"
              id="room-id"
              class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="xxxxxx"
            />
            <p class="text-gray-400 text-xs mt-2">
              방 코드를 비워두면 새로운 방이 생성됩니다.
            </p>
          </div>
          <button
            id="join-btn"
            class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
          >
            입장 또는 생성
          </button>
        </div>
      </div>

      <!-- Room: 게임 화면 -->
      <div id="room" class="hidden">
        <!-- Header -->
        <div
          class="flex justify-between items-center mb-4 p-4 bg-gray-800 rounded-lg"
        >
          <div>
            <span class="text-xl font-bold">방 코드: <span id="room-code"></span></span>
            <div id="user-list" class="text-sm text-gray-400 mt-1"></div>
          </div>
          <div class="text-center">
            <div class="text-lg">남은 시간</div>
            <div id="timer" class="text-3xl font-bold text-yellow-400">45</div>
          </div>
          <div class="text-right">
            <div class="text-lg">라운드</div>
            <div id="round" class="text-3xl font-bold">1</div>
          </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-3 gap-4">
          <!-- Question & Answers -->
          <div class="col-span-2 bg-gray-800 p-6 rounded-lg">
            <div id="question-phase" class="">
              <img
                id="question-image"
                src=""
                alt="Question Image"
                class="w-full h-80 object-contain rounded-md mb-4 bg-gray-700"
              />
              <p id="question-text" class="text-xl text-center mb-4"></p>
              <textarea
                id="answer-input"
                rows="3"
                class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                placeholder="여러분의 생각을 자유롭게 적어주세요..."
              ></textarea>
              <button
                id="submit-answer-btn"
                class="mt-4 w-full text-white bg-green-600 hover:bg-green-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
              >
                답변 제출
              </button>
            </div>

            <div id="reveal-phase" class="hidden">
              <h2 class="text-2xl font-bold mb-4 text-center">다른 사람들의 생각</h2>
              <div id="answers-container" class="space-y-4">
                <!-- Answers will be dynamically inserted here -->
              </div>
               <button
                id="next-round-btn"
                class="mt-6 w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
              >
                다음 라운드로
              </button>
            </div>
          </div>

          <!-- Chat -->
          <div class="bg-gray-800 rounded-lg flex flex-col h-[40rem]">
            <div class="p-4 border-b border-gray-700">
              <h2 class="text-xl font-bold">채팅</h2>
            </div>
            <div id="chat-messages" class="flex-1 p-4 space-y-3 overflow-y-auto">
              <!-- Chat messages will be here -->
            </div>
            <div class="p-4">
              <input
                type="text"
                id="chat-input"
                class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg block w-full p-2.5"
                placeholder="메시지 입력..."
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
